<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Watt Audio</title>
<style>
  :root { --accent:#F74E05; --ink:#1b1d22; --muted:#6b7280; --line:#ececf0; --bg:#fafafa; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.6; }
  .wrap { max-width:680px; margin:0 auto; padding:48px 22px 64px; }
  .hero { display:flex; align-items:center; gap:18px; margin-bottom:36px; }
  .logo { width:84px; height:84px; border-radius:20px; box-shadow:0 8px 24px rgba(247,78,5,.25); }
  h1 { font-size:30px; margin:0; }
  .tag { color:var(--muted); margin:4px 0 0; }
  .cards { display:grid; gap:14px; }
  a.card { display:flex; align-items:center; justify-content:space-between; text-decoration:none; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 20px; transition:.15s; }
  a.card:hover { border-color:var(--accent); transform:translateY(-1px); }
  a.card b { font-size:17px; } a.card span { color:var(--muted); font-size:14px; }
  .arrow { color:var(--accent); font-size:22px; }
  footer { color:var(--muted); font-size:13px; margin-top:40px; text-align:center; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <img class="logo" src="icon.png" alt="Watt Audio" />
      <div>
        <h1>Watt Audio</h1>
        <p class="tag">Chuyển truyện chữ thành audio, nghe mọi lúc.</p>
      </div>
    </div>
    <div class="cards">
      <a class="card" href="privacy.html"><div><b>Chính sách quyền riêng tư</b><br /><span>Privacy Policy</span></div><span class="arrow">→</span></a>
      <a class="card" href="support.html"><div><b>Hỗ trợ</b><br /><span>Support</span></div><span class="arrow">→</span></a>
    </div>
    <footer>© 2026 Watt Audio</footer>
  </div>
</body>
</html>
